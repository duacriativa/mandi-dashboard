<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Shopify</title>
<style>
  :root {
    --ink: #0a0a0a;
    --paper: #f4f4f4;
    --card: #ffffff;
    --line: #e4e4e4;
    --muted: #6b6b6b;
    --up: #1c7c3f;
    --down: #c1382b;
    --warn: #a8710a;
    --warn-bg: #fdf3e2;
    --good-bg: #eaf6ee;
    --bad-bg: #fbeae8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .layout { display: flex; min-height: 100vh; }
  nav.sidebar {
    width: 200px;
    background: var(--ink);
    color: #fff;
    padding: 24px 16px;
    flex-shrink: 0;
  }
  .brand { font-weight: 800; letter-spacing: 0.08em; font-size: 20px; margin-bottom: 32px; }
  .navitem {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: #cfcfcf;
    margin-bottom: 4px;
  }
  .navitem.active { background: #1c1c1c; color: #fff; }

  main { flex: 1; padding: 28px 32px; }
  header.top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: 0.02em; }
  .subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .period-pill { border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  .kpi-label { font-size: 11px; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; }
  .kpi-value { font-size: 28px; font-weight: 700; margin: 6px 0 8px; }
  .delta { font-size: 12px; font-weight: 600; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta-context { color: var(--muted); font-weight: 400; margin-left: 4px; }

  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-2.even { grid-template-columns: 1fr 1fr; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  .section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; color: #333; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .bar-bg { background: #eee; height: 6px; border-radius: 4px; overflow: hidden; width: 80px; display: inline-block; margin-left: 8px; vertical-align: middle;}
  .bar-fill { background: var(--ink); height: 100%; }

  .stock-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stock-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .stock-box { background: #fafafa; border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .stock-box .val { font-size: 20px; font-weight: 700; }
  .stock-box .val.small { font-size: 16px; }
  .stock-box .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  .alerts-list { display: flex; flex-direction: column; gap: 8px; }
  .alert-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .alert-item.good { background: var(--good-bg); color: #1c5c33; }
  .alert-item.bad { background: var(--bad-bg); color: #8f2a20; }
  .alert-item.warning { background: var(--warn-bg); color: #7a5308; }
  .alert-dot { flex-shrink: 0; margin-top: 3px; }

  .updated { color: var(--muted); font-size: 11px; margin-top: 24px; text-align: center; }

  svg.chart { width: 100%; height: 160px; }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .grid-2, .grid-2.even, .grid-3 { grid-template-columns: 1fr; }
    nav.sidebar { display: none; }
  }
