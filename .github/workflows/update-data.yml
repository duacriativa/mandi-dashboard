name: Atualizar dados do Shopify

on:
  schedule:
    # Todos os dias às 08:00 (horário de Brasília = UTC-3 -> 11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write

# Evita dois runs simultâneos brigando pelo mesmo commit no data.json
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      HAS_META: ${{ secrets.META_ACCESS_TOKEN != '' && secrets.META_AD_ACCOUNT_ID != '' }}
      HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Buscar dados do Shopify
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/fetch-shopify.mjs

      # continue-on-error: se a Meta falhar (token expirado, versão da API
      # descontinuada, instabilidade), o dashboard de VENDAS continua sendo
      # atualizado normalmente. O run aparece com aviso, não com falha total.
      - name: Buscar dados da Meta Ads
        id: meta
        if: ${{ env.HAS_META == 'true' }}
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: node scripts/fetch-meta-ads.mjs

      - name: Avisar se a Meta falhou
        if: ${{ steps.meta.outcome == 'failure' }}
        run: |
          echo "::warning::A busca de dados da Meta Ads falhou. Os dados de vendas foram atualizados normalmente, mas os números de anúncio estão desatualizados. Veja o log do step 'Buscar dados da Meta Ads'."

      # Instagram usa o MESMO token da Meta (precisa das permissões
      # instagram_basic + instagram_manage_insights + pages_read_engagement)
      - name: Buscar dados do Instagram
        if: ${{ env.HAS_META == 'true' }}
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: node scripts/fetch-instagram.mjs

      - name: Calcular alertas automáticos
        run: node scripts/compute-alerts.mjs

      # Análise comercial por IA (opcional). continue-on-error: se a API
      # falhar ou a chave não existir, os dados de venda seguem normais.
      - name: Gerar análise comercial (IA)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-insights.mjs

      - name: Publicar data.json atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "Nada mudou, nada a commitar." && exit 0
          git commit -m "Atualiza dados do Shopify"
          # Se alguém commitou enquanto o job rodava, rebase antes de empurrar
          git pull --rebase origin main
          git push
